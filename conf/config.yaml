  - paths
  - variables
  - harmonise
  - label_aliases
  - variable_types
  - masking
  - missingness
  - inputs
  - results_v2
  - fidelity
  - prediction
  - stats
  - reporting
  - imputation/_base
  - imputation/mean
  - imputation/knn
  - imputation/mice
  - imputation/missranger
  - imputation/miwae
  - imputation/gain
  - imputation/miracle
  - imputation/remasker
  - cohorts/cohort1
  - cohorts/cohort2
  - experiment/v2

seed: 2025
log_level: INFO
