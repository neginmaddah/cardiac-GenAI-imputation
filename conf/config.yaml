# ═════════════════════════════════════════════════════════════════════════════
# Root configuration. Everything else is composed from here.
#
# Every parameter the benchmark uses lives under conf/. No path, seed, target
# name or hyperparameter is written down anywhere else, which is what makes a
# run reproducible from this directory alone.
#
#   python pipeline/01_harmonise.py
#   python pipeline/02_build_masks.py
#   ...  see README.md for the full stage order
# ═════════════════════════════════════════════════════════════════════════════

