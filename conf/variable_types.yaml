# ---------------------------------------------------------------------------
# Continuous columns whose ranges must agree across cohorts. Check stop 1
# compares medians and fails outside `median_ratio_band` -- this is the test
# that catches an `or_duration_hours` hours-vs-minutes repeat.
# ---------------------------------------------------------------------------
range_check:
  median_ratio_band: [0.5, 2.0]
  # Known unit sentinels to strip before the comparison. Cohort1 records 5000 hours
  # for a handful of ICU records (conf/cohorts/cohort1.yaml sentinel_exclusions).
  sentinels:
    icuinhrs: [5000]
    icuadhrs: [5000]
  # Physiologically impossible values observed in the raw Cohort1 export
  # (bmi max 146.98). Set to NaN rather than clipped, so they are imputed
  # rather than silently invented.
  implausible:
    bmi: {min: 12.0, max: 80.0}
    heightcm: {min: 100.0, max: 220.0}
    weightkg: {min: 30.0, max: 250.0}
